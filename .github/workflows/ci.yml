name: CI

# Installs the formula from the checkout as a local tap and runs the
# formula test block, mimicking the end-user flow.

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        # Godot publishes Linux x86_64 and arm64 builds.
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Install formula from checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/pulseb"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/pulseb/homebrew-godot"
          brew trust pulseb/godot || true
          brew install pulseb/godot/godot@4
          brew install pulseb/godot/godot@3

      - name: Run formula test blocks
        run: |
          brew test pulseb/godot/godot@4
          brew test pulseb/godot/godot@3

      - name: Smoke tests
        run: |
          godot4 --version
          godot3 --version
          godot --version  # alias -> godot4
