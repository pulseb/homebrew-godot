name: Update formulae

# Daily check for new Godot stable releases; for each series (4.x, 3.x)
# updates the matching formula (version + SHA-256) and pushes the change
# directly to main.

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formulae to latest Godot stable releases
        run: python3 scripts/update_formula.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain Formula/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/
            git commit -m "feat(formula): update godot formulae to latest stable releases"
            git push
          else
            echo "Formulae already up to date; nothing to commit."
          fi
